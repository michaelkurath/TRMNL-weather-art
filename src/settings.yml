---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.7
serverless_language: ''
refresh_interval_floor: '60'
polling_url: 'https://api.open-meteo.com/v1/forecast?latitude={{ weather_location | default: ''47.3769,8.5417'' | split: '','' | first | strip }}&longitude={{ weather_location | default: ''47.3769,8.5417'' | split: '','' | last | strip }}&current=weather_code,wind_speed_10m,is_day&wind_speed_unit=kmh'
polling_headers: ''
polling_body: ''
id: 552013
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: scene
  field_type: select
  name: Scene
  description: Choose the setting depicted in the artwork. Mountain Lake uses the Neutral style.
  options:
  - Small village: village
  - Big city: city
  - Mountain Lake: mountain-lake
  default: village
  conditional_validation:
  - when: village
    visible:
    - artist
  - when: city
    visible:
    - city_artist
- keyname: artist
  field_type: select
  name: Artist
  optional: true
  options:
  - Van Gogh–inspired: van-gogh
  - Warhol-inspired: warhol
  - Picasso-inspired: picasso
  - Neutral: neutral
  default: van-gogh
- keyname: city_artist
  field_type: select
  name: Artist
  description: Current city style preserves your existing Big City artwork. New installations start with Van Gogh.
  optional: true
  options:
  - Current city style: current
  - Van Gogh–inspired: van-gogh
  - Warhol-inspired: warhol
  - Neutral: neutral
  default: current
- keyname: weather_location
  field_type: lat_lon
  name: Weather location
  description: Search for the city or postal code used for current weather.
  default: 47.3769,8.5417
- keyname: about
  field_type: author_bio
  name: About Weather Art
  description: Weather Art turns your local weather into full-screen art. Choose a scene and a style, then watch the artwork change as the weather does. Illustrations are original AI-assisted studies. Weather data by <a href="https://open-meteo.com/">Open-Meteo</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>). Contact <a href="https://github.com/michaelkurath">Michael Kurath on GitHub</a>.
name: Weather Art
description: Art that changes with your weather
refresh_interval: 60
