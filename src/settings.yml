---
name: Weather Art
description: Weather painted in famous styles
strategy: polling
refresh_interval: 60
polling_verb: GET
polling_headers: ''
polling_url: >-
  https://api.open-meteo.com/v1/forecast?latitude={{ weather_location | default: '47.3769,8.5417' | split: ',' | first | strip }}&longitude={{ weather_location | default: '47.3769,8.5417' | split: ',' | last | strip }}&current=weather_code
no_screen_padding: 'yes'
dark_mode: 'no'
custom_fields:
  - keyname: artist
    field_type: select
    name: Artist
    description: Choose the artistic treatment.
    options:
      - Van Gogh–inspired: van-gogh
      - Warhol-inspired: warhol
    default: van-gogh
  - keyname: scene
    field_type: select
    name: Scene
    description: Choose the setting depicted in the artwork.
    options:
      - Small village: village
      - Big city: city
    default: village
  - keyname: weather_location
    field_type: lat_lon
    name: Weather location
    description: Search for the city or postal code used for current weather.
    default: '47.3769,8.5417'
  - keyname: about
    field_type: author_bio
    name: About Weather Art
    description: >-
      Artist-inspired artwork driven by your current local weather.
      Illustrations are original AI-assisted studies.
      Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>
      (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>).
